services:
  - type: web
    name: kna-steth-day-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: VITE_FIRESTORE_DATABASE_ID
        sync: false
      - key: VITE_FIREBASE_OAUTH_CLIENT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://knastethday.online,https://www.knastethday.online
